name: Deploy

on:
  push:
    branches:
      - dom

permissions:
  id-token: write  # required for OIDC token request
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Infrastructure
        id: bicep
        run: |
          az deployment sub create \
            --name "r3d1r3kt0r-$(date +%Y%m%d%H%M%S)" \
            --location eastus \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --query "properties.outputs" \
            --output json > bicep-outputs.json

          echo "acr_server=$(jq -r '.acrLoginServer.value' bicep-outputs.json)"   >> "$GITHUB_OUTPUT"
          echo "rg_name=$(jq -r '.resourceGroupName.value' bicep-outputs.json)"   >> "$GITHUB_OUTPUT"
          echo "app_name=$(jq -r '.containerAppName.value' bicep-outputs.json)"   >> "$GITHUB_OUTPUT"

      - name: Set image tag
        id: tag
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          ACR="${{ steps.bicep.outputs.acr_server }}"
          echo "sha=${ACR}/r3d1r3kt0r:${SHORT_SHA}"   >> "$GITHUB_OUTPUT"
          echo "latest=${ACR}/r3d1r3kt0r:latest"      >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ steps.tag.outputs.sha }}" \
            -t "${{ steps.tag.outputs.latest }}" \
            .

      - name: Push to ACR
        run: |
          ACR_NAME="$(echo '${{ steps.bicep.outputs.acr_server }}' | cut -d. -f1)"
          az acr login --name "$ACR_NAME"
          docker push "${{ steps.tag.outputs.sha }}"
          docker push "${{ steps.tag.outputs.latest }}"

      - name: Update Container App
        run: |
          az containerapp update \
            --name "${{ steps.bicep.outputs.app_name }}" \
            --resource-group "${{ steps.bicep.outputs.rg_name }}" \
            --image "${{ steps.tag.outputs.sha }}"
